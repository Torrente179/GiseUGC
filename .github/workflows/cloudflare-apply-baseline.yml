name: Cloudflare Apply Baseline

on:
  workflow_dispatch:
    inputs:
      emergency_mode:
        description: "Apply emergency thresholds (60%) instead of baseline"
        type: boolean
        default: false

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ZONE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply baseline rules
        run: |
          if [ "${{ inputs.emergency_mode }}" = "true" ]; then
            node security/scripts/apply-cloudflare-baseline.mjs --apply --emergency
          else
            node security/scripts/apply-cloudflare-baseline.mjs --apply
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
